name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac --publish never
          - os: windows-latest
            args: --win --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DETECTION: 'false'
      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.exe > SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: myworkbench-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
